name: Import BudgetQuest source

on:
  push:
    paths:
      - '.github/workflows/import-budgetquest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cloud repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone stable BudgetQuest repository
        run: git clone --depth 1 https://github.com/ismaelheusser-bot/budgetquest-app.git /tmp/budgetquest-app

      - name: Copy application files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'README.md' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/budgetquest-app/ ./
          cat > README.md <<'EOF'
          # BudgetQuest Cloud

          Deutsche Cloud-Weiterentwicklung der aktuellen BudgetQuest-App.

          Die stabile bisherige Version bleibt in `budgetquest-app`. Dieses Repository ist die Entwicklungsbasis für Firebase-Synchronisation, gemeinsame Haushalte und den intelligenten lernenden Belegleser.
          EOF

      - name: Commit imported source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to import.'
          else
            git commit -m 'Import current BudgetQuest application'
            git push
          fi
