name: Import BudgetQuest source

on:
  push:
    paths:
      - '.github/workflows/import-budgetquest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cloud repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone stable BudgetQuest repository
        run: git clone --depth 1 https://github.com/ismaelheusser-bot/budgetquest-app.git /tmp/budgetquest-app

      - name: Copy application files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'README.md' -exec rm -rf {} +
          cp -a /tmp/budgetquest-app/. .
          rm -rf .git
          mkdir -p .github/workflows
          git checkout -- .github/workflows/import-budgetquest.yml
          cat > README.md <<'EOF'
          # BudgetQuest Cloud

          Cloud-enabled development copy of BudgetQuest.

          The stable local version remains in `budgetquest-app`. This repository is the development base for Firebase synchronization, multi-user households and the intelligent receipt reader.
          EOF

      - name: Commit imported source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to import.'
          else
            git commit -m 'Import current BudgetQuest application'
            git push
          fi
