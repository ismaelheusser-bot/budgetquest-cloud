name: BudgetQuest Cloud veröffentlichen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: BudgetQuest prüfen
        run: node tests/storage-service.test.js && node tests/cloud-sync-service.test.js && node tests/firebase-foundation.test.js && node tests/firebase-cloud-controller.test.js

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5
      - name: App-Paket vorbereiten
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: BudgetQuest veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
